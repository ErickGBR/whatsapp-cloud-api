# Render Blueprint — WhatsApp Sales Bot
# Uses Docker runtime with embedded Redis (supervisord single container)
services:
  - type: web
    name: whatsapp-bot-sales
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DB_STORAGE
        value: ./data/database.sqlite
      - key: JWT_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: HUGGING_FACE_TOKEN
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
