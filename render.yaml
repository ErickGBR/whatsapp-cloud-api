# Render Blueprint — WhatsApp Sales Bot
# Uses Docker runtime (single unified image serving backend + dashboard).
services:
  - type: web
    name: whatsapp-bot-sales
    runtime: docker   # uses ./Dockerfile (3-stage build: backend + dashboard + runtime)
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      # --- Runtime ---
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DB_STORAGE
        value: ./data/database.sqlite
      - key: DASHBOARD_STATIC_DIR
        value: /app/public
      # --- REQUIRED secrets (sync: false = value NOT tracked in git) ---
      # Set these in the Render dashboard (Service -> Environment) after the
      # first Blueprint sync. The app crashes on boot without them:
      # JWT_SECRET — signs session/admin tokens; without it the app refuses
      #   to start in production (SEC-002).
      - key: JWT_SECRET
        sync: false
      # ADMIN_EMAIL / ADMIN_PASSWORD — initial admin credentials. The app
      #   refuses to boot in production without them (SEC-002).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- Optional ---
      # WhatsApp Cloud API credentials (optional — Baileys QR is the primary
      # channel; these enable the Cloud API webhook path).
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      # GEMINI_API_KEY — enables Gemini AI features (optional; the bot works
      #   without it, falling back to rule-based responses).
      - key: GEMINI_API_KEY
        sync: false
      # Redis is OPTIONAL (the app fails fast and runs without queues if
      # unset). Render's free tier does NOT include Redis.
      - key: REDIS_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      # Dashboard CORS origin (optional — the dashboard is served from the
      # same origin as the API in this unified image).
      - key: DASHBOARD_ORIGIN
        sync: false
