[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --appendonly yes --dir /app/data
autostart=true
autorestart=true
stdout_logfile=/app/logs/redis.log
stderr_logfile=/app/logs/redis.log

[program:app]
command=node dist/server.js
autostart=true
autorestart=true
stdout_logfile=/app/logs/app.log
stderr_logfile=/app/logs/app.log
environment=NODE_ENV="production",PORT="3000",REDIS_HOST="localhost",REDIS_PORT="6379"
