# GitHub Actions CI — WhatsApp Sales Bot
# Builds the backend (TypeScript) and the dashboard (Vite) using yarn.
# Tests are intentionally skipped: jest is knowingly broken (no jest.config)
# and would fail the pipeline. Build-only keeps CI green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            dashboard/yarn.lock

      - name: Enable yarn via corepack
        run: corepack enable

      - name: Install backend dependencies
        run: yarn install --frozen-lockfile

      - name: Build backend (TypeScript → dist/)
        run: yarn build

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: yarn install --frozen-lockfile

      - name: Build dashboard (Vite → dist/)
        working-directory: dashboard
        run: yarn build
